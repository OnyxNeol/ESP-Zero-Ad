; ============================================================================
; ESP32-S3 DNS Sinkhole Ad Blocker — PlatformIO Configuration
; ============================================================================

[platformio]
default_envs = esp32s3
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Build flags ---
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_HID_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ARCH_ESP32
    -DBLUETOOTH_USE_BLUEDROID

; --- Libraries ---
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ; BLE is built into ESP32 Arduino core (no external dep needed)

; --- Upload settings ---
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Partition scheme: 16MB flash, large LittleFS partition ---
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

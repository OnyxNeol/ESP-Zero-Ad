<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>ESP32 Ad Blocker — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Dashboard Password Prompt Modal -->
<div id="api-key-overlay" class="overlay" style="display:none">
  <div class="modal-box">
    <h2>🔐 Enter Dashboard Password</h2>
    <p class="muted">Enter the dashboard password for your ESP32-S3 ad blocker to continue.</p>
    <input type="password" id="api-key-input" class="input" placeholder="Dashboard Password" autocomplete="off">
    <div class="modal-actions">
      <button id="api-key-save" class="btn btn-primary">Save & Connect</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="toast-container"></div>

<!-- Confirmation Modal -->
<div id="confirm-overlay" class="overlay" style="display:none">
  <div class="modal-box">
    <h2 id="confirm-title">Confirm</h2>
    <p id="confirm-message" class="muted"></p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
      <button id="confirm-ok" class="btn btn-danger">Confirm</button>
    </div>
  </div>
</div>

<!-- App Layout -->
<div class="app-layout">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="13" stroke="#00d4aa" stroke-width="2"/>
          <path d="M9 14l3 3 7-7" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">ESP32<span class="accent">Block</span></span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="#dashboard" class="nav-item" data-route="dashboard">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#blocklist" class="nav-item" data-route="blocklist">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2L3 5v5c0 4 3 7 7 8 4-1 7-4 7-8V5l-7-3z"/><path d="M7 10l2 2 4-4"/></svg>
        <span>Block List</span>
      </a>
      <a href="#overall" class="nav-item" data-route="overall">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 17l5-5 4 4 5-7"/><circle cx="3" cy="17" r="1.5" fill="currentColor"/><circle cx="8" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/><circle cx="17" cy="10" r="1.5" fill="currentColor"/></svg>
        <span>Overall</span>
      </a>
      <a href="#router" class="nav-item" data-route="router">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="16" height="8" rx="2"/><circle cx="5" cy="10" r="1" fill="currentColor"/><circle cx="8" cy="10" r="1" fill="currentColor"/><path d="M12 10h4M14 8v4"/></svg>
        <span>Router Reports</span>
      </a>
      <a href="#adguard" class="nav-item" data-route="adguard">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M7 8h6M7 11h4"/><path d="M14 13l2 2"/></svg>
        <span>Ad Blocker Test</span>
      </a>
      <a href="#reports" class="nav-item" data-route="reports">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h12v12H4z"/><path d="M7 8h6M7 11h4"/></svg>
        <span>Ad Reports</span>
      </a>
      <a href="#settings" class="nav-item" data-route="settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 1v3M10 16v3M1 10h3M16 10h3M3.5 3.5l2 2M14.5 14.5l2 2M16.5 3.5l-2 2M5.5 14.5l-2 2"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div id="connection-status" class="connection-status">
        <span class="status-dot status-disconnected"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </div>
  </aside>

  <!-- Mobile sidebar backdrop -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- Main Content -->
  <main class="main-content">
    <header class="topbar">
      <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-spacer"></div>
      <button id="api-key-edit" class="btn btn-icon" title="Change Dashboard Password">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l5 5-8 8H3v-5l8-8z"/></svg>
      </button>
    </header>

    <div id="view-container" class="view-container">
      <!-- Views are injected here -->
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/blocklist.js"></script>
<script src="js/adguard.js"></script>
<script src="js/reports.js"></script>
<script src="js/router.js"></script>
<script src="js/overall.js"></script>
<script src="js/settings.js"></script>
<script src="js/wizard.js"></script>
</body>
</html>

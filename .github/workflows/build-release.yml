name: Build ESP-Zero-Ad Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Build filesystem image
        working-directory: firmware
        run: pio run --target buildfs

      - name: Collect binaries
        run: |
          mkdir -p firmware-release
          BUILD_DIR="firmware/.pio/build/esp32s3"
          cp "$BUILD_DIR/firmware.bin" firmware-release/
          cp "$BUILD_DIR/bootloader.bin" firmware-release/
          cp "$BUILD_DIR/partitions.bin" firmware-release/
          cp "$BUILD_DIR/littlefs.bin" firmware-release/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Zero-Ad-firmware
          path: firmware-release/*

  release:
    needs: [build-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: ESP-Zero-Ad-firmware
          path: firmware-release

      - name: Prepare release files
        run: |
          mkdir -p release
          cp firmware-release/*.bin release/
          cp wizard.html release/
          cp firmware/manifest.json release/ 2>/dev/null || true
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ESP-Zero-Ad ${{ github.ref_name }}
          body: |
            # ESP-Zero-Ad — ESP32-S3 DNS Sinkhole
            
            ## Setup (No Terminal)
            
            1. Open `wizard.html` in Chrome or Edge
            2. Enter WiFi credentials and dashboard password
            3. Click Flash — browser flashes the ESP32-S3 via USB
            4. Device boots, loads 129 ad domains, starts blocking
            5. Open `http://esp32-pihole.local` from any device on your network
            
            ## Included Files
            - `firmware.bin` — ESP32-S3 firmware
            - `bootloader.bin` — Bootloader
            - `partitions.bin` — Partition table
            - `littlefs.bin` — Web dashboard filesystem image
            - `wizard.html` — Browser-based setup wizard
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

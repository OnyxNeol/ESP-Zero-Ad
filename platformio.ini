; PlatformIO configuration for ESP32-S3 Pi-Hole
; 
; Open this project in PlatformIO or VS Code with PlatformIO extension
; Run: pio run --target upload  to flash to your ESP32-S3
; Run: pio run --target uploadfs to upload web dashboard to LittleFS

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Libraries
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  espressif/ESPmDNS@^1.0.1

; Upload settings - adjust COM port as needed
upload_port = COM3
upload_speed = 921600

; Build flags
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  ; Uncomment to enable debug output
  ; -DDEBUG=1
